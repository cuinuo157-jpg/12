name: Build iOS Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=12.0 -fobjc-arc -framework Foundation -framework UIKit -lc++ Bypass.mm fishhook.c -o FullBypass.dylib
          brew install ldid
          ldid -S FullBypass.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass-Dylib
          path: FullBypass.dylib
